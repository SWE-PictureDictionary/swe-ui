<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topics</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .top-left h1 {
            margin: 0;
            font-size: 34px;
        }

        .top-left p {
            margin: 8px 0 0;
            color: #555;
        }

        .top-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .action-button {
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #222;
            background: white;
            border: 1px solid #d0d0d0;
        }

        .action-button.primary {
            background: #222;
            color: white;
            border-color: #222;
        }

        .action-button.danger {
            background: #e2e8f0;
            color: #222;
            border-color: #cbd5e1;
        }

        .topic-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .topic-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .topic-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #ddd;
        }

        .topic-content {
            padding: 18px;
        }

        .topic-content h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .topic-content p {
            margin: 0 0 16px;
            color: #555;
        }

        .topic-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .open-button {
            display: inline-block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 14px;
            border-radius: 9px;
            font-weight: bold;
        }

        .delete-button {
            border: none;
            cursor: pointer;
            background: #e6b0b0;
            color: #222;
            padding: 10px 14px;
            border-radius: 9px;
            font-weight: bold;
        }

        .empty-message {
            background: white;
            padding: 24px;
            border-radius: 16px;
            color: #555;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        @media (max-width: 700px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .top-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="top-bar">
        <div class="top-left">
            <h1 id="pageTitle">Topics</h1>
            <p id="languageNotice"></p>
        </div>

        <div class="top-actions">
            <a class="action-button" href="/index.html">Change Language</a>
            <button id="undoTopicButton" class="action-button" type="button">Undo Last Topic Change</button>
            <a id="createTopicLink" class="action-button primary" href="/add_topic.html">Create Topic</a>
            <button class="action-button danger" type="button" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="topicList" class="topic-list"></div>
</div>

<script src="/auth.js"></script>
<script>
    const API_BASE = "/topics";
    const TOPIC_UNDO_KEY = "topicUndoAction";

    const params = new URLSearchParams(window.location.search);
    const selectedLanguage = params.get("language") || localStorage.getItem("selectedLanguage") || "Spanish";

    localStorage.setItem("selectedLanguage", selectedLanguage);

    const topicList = document.getElementById("topicList");
    const pageTitle = document.getElementById("pageTitle");
    const languageNotice = document.getElementById("languageNotice");
    const createTopicLink = document.getElementById("createTopicLink");
    const undoTopicButton = document.getElementById("undoTopicButton");
    let currentUser = null;

    pageTitle.innerText = selectedLanguage + " Topics";
    languageNotice.innerText = "Choose a topic to start learning " + selectedLanguage + ".";
    createTopicLink.href = "/add_topic.html?language=" + encodeURIComponent(selectedLanguage);

    undoTopicButton.addEventListener("click", undoLastTopicChange);

    function applyRoleControls() {
        const canManage = canManageTopics(currentUser);
        createTopicLink.style.display = canManage ? "" : "none";
        undoTopicButton.style.display = canManage ? "" : "none";
    }

    function getTopicLanguageAssignments() {
        try {
            return JSON.parse(localStorage.getItem("topicLanguageAssignments")) || {};
        } catch (error) {
            return {};
        }
    }

    function saveTopicLanguageAssignments(assignments) {
        localStorage.setItem("topicLanguageAssignments", JSON.stringify(assignments));
    }

    function assignTopicToLanguage(topicId, language) {
        const assignments = getTopicLanguageAssignments();
        const languages = new Set(assignments[topicId] || []);
        languages.add(language);
        assignments[topicId] = Array.from(languages);
        saveTopicLanguageAssignments(assignments);
    }

    function removeTopicAssignment(topicId) {
        const assignments = getTopicLanguageAssignments();
        delete assignments[topicId];
        saveTopicLanguageAssignments(assignments);
    }

    function topicMatchesLanguage(topic) {
        const assignments = getTopicLanguageAssignments();

        if (assignments[topic.id] && assignments[topic.id].includes(selectedLanguage)) {
            return true;
        }

        if (topic.category && topic.category.toLowerCase() === selectedLanguage.toLowerCase()) {
            return true;
        }

        if (!topic.hotspots || topic.hotspots.length === 0) {
            return false;
        }

        return topic.hotspots.some(function(hotspot) {
            const translations = hotspot.translations || {};
            const audioUrls = hotspot.audioUrls || {};

            return translations[selectedLanguage] || audioUrls[selectedLanguage];
        });
    }

    function renderTopics(topics) {
        topicList.innerHTML = "";

        const filteredTopics = topics.filter(topicMatchesLanguage);

        if (filteredTopics.length === 0) {
            const createHint = canManageTopics(currentUser) ? " Use Create Topic to add one." : "";
            topicList.innerHTML = `
                <div class="empty-message">
                    No topics found for ${escapeHtml(selectedLanguage)}.${createHint}
                </div>
            `;
            return;
        }

        filteredTopics.forEach(function(topic) {
            const card = document.createElement("div");
            card.className = "topic-card";

            const image = document.createElement("img");
            image.src = topic.imageUrl || "";
            image.alt = topic.title || "Topic image";

            const content = document.createElement("div");
            content.className = "topic-content";

            const title = document.createElement("h2");
            title.innerText = topic.title || "Untitled Topic";

            const category = document.createElement("p");
            category.innerText = topic.category || "Topic";

            const actions = document.createElement("div");
            actions.className = "topic-actions";

            const openLink = document.createElement("a");
            openLink.className = "open-button";
            openLink.href = "/topic.html?id=" + encodeURIComponent(topic.id) + "&language=" + encodeURIComponent(selectedLanguage);
            openLink.innerText = "Open";

            actions.appendChild(openLink);

            if (canManageTopics(currentUser)) {
                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.type = "button";
                deleteButton.innerText = "Delete Topic";

                deleteButton.addEventListener("click", function() {
                    deleteTopic(topic);
                });

                actions.appendChild(deleteButton);
            }

            content.appendChild(title);
            content.appendChild(category);
            content.appendChild(actions);

            card.appendChild(image);
            card.appendChild(content);

            topicList.appendChild(card);
        });
    }

    async function deleteTopic(topic) {
        if (!canManageTopics(currentUser)) {
            return;
        }

        const confirmed = window.confirm("Delete " + (topic.title || "this topic") + "?");

        if (!confirmed) {
            return;
        }

        try {
            const response = await fetchWithCsrf(API_BASE + "/" + encodeURIComponent(topic.id), {
                method: "DELETE"
            });

            if (!response.ok && response.status !== 204) {
                throw new Error("Delete failed with status " + response.status);
            }

            saveTopicUndoAction({
                type: "delete",
                topic: topic,
                language: selectedLanguage,
                assignments: getTopicLanguageAssignments()[topic.id] || [selectedLanguage]
            });

            removeTopicAssignment(topic.id);
            await loadTopics();
        } catch (error) {
            console.error(error);
            alert("Could not delete topic.");
        }
    }

    async function undoLastTopicChange() {
        if (!canManageTopics(currentUser)) {
            return;
        }

        const action = getTopicUndoAction();

        if (!action) {
            alert("No topic change to undo.");
            return;
        }

        try {
            if (action.type === "create") {
                const topicId = action.topic?.id;

                if (!topicId) {
                    throw new Error("Undo data is missing the created topic id.");
                }

                const response = await fetchWithCsrf(API_BASE + "/" + encodeURIComponent(topicId), {
                    method: "DELETE"
                });

                if (!response.ok && response.status !== 204 && response.status !== 404) {
                    throw new Error("Could not undo topic creation.");
                }

                removeTopicAssignment(topicId);
            } else if (action.type === "delete") {
                const response = await fetchWithCsrf(API_BASE, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(action.topic)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Could not undo topic deletion.");
                }

                const languages = action.assignments && action.assignments.length > 0
                    ? action.assignments
                    : [action.language || selectedLanguage];

                languages.forEach(language => assignTopicToLanguage(action.topic.id, language));
            }

            clearTopicUndoAction();
            await loadTopics();
        } catch (error) {
            console.error(error);
            alert(error.message || "Could not undo topic change.");
        }
    }

    function getTopicUndoAction() {
        try {
            return JSON.parse(localStorage.getItem(TOPIC_UNDO_KEY));
        } catch (error) {
            return null;
        }
    }

    function saveTopicUndoAction(action) {
        localStorage.setItem(TOPIC_UNDO_KEY, JSON.stringify(action));
    }

    function clearTopicUndoAction() {
        localStorage.removeItem(TOPIC_UNDO_KEY);
    }

    async function loadTopics() {
        try {
            const response = await fetch(API_BASE);

            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }

            const topics = await response.json();
            renderTopics(topics);
        } catch (error) {
            console.error(error);
            topicList.innerHTML = `
                <div class="empty-message">
                    Could not load topics. Make sure the backend is running.
                </div>
            `;
        }
    }

    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function logout() {
        window.location.assign("/logout");
    }

    async function initializePage() {
        try {
            currentUser = await loadCurrentUser();

            if (!currentUser) {
                return;
            }

            applyRoleControls();
            await loadTopics();
        } catch (error) {
            console.error(error);
            topicList.innerHTML = `
                <div class="empty-message">
                    Could not verify your sign-in status.
                </div>
            `;
        }
    }

    initializePage();

</script>

</body>
</html>
