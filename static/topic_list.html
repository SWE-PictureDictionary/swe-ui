<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 8px;
        }

        .topic-list {
            margin-top: 24px;
            display: grid;
            gap: 16px;
            max-width: 700px;
        }

        .topic-card {
            background: #b4b4b4;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid black;
            cursor: pointer;
        }

        .topic-card img {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }

        .topic-title {
            font-size: 20px;
            font-weight: bold;
        }

        .topic-category {
            margin-top: 6px;
        }

        .topic-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        .delete-button {
            padding: 10px 14px;
            border: 1px solid black;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            color: black;
            display: inline-block;
            background: #d9d9d9;
        }

        .delete-button {
            background: #e7b3b3;
        }

        .empty-message {
            margin-top: 24px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<a class="back-link" href="/index.html">← Back to Language Selection</a>

    <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
        <button id="logoutBtn"
                style="padding:8px 12px; border:1px solid black; border-radius:8px; background:#b4b4b4; cursor:pointer;">
            Logout
        </button>
    </div>


<h1 id="pageTitle">Topics</h1>
<p id="languageLabel"></p>

<div class="topic-list" id="topicList"></div>

<script>
    const selectedLanguage = localStorage.getItem("selectedLanguage") || "Spanish";
    const topicList = document.getElementById("topicList");
    const API_BASE = "/topics";

    console.log("Calling API:", API_BASE);

    let currentUserInfo = null;

    document.getElementById("pageTitle").innerText = selectedLanguage + " Topics";
    document.getElementById("languageLabel").innerText = "You are learning: " + selectedLanguage;

    function topicMatchesLanguage(topic) {
        if (!topic.hotspots || topic.hotspots.length === 0) {
            return true;
        }

        return topic.hotspots.some(function (hotspot) {
            return hotspot.translations && hotspot.translations[selectedLanguage];
        });
    }

    async function loadTopics() {
        try {
            const response = await fetch(API_BASE);
            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }

            const topics = await response.json();
            const filteredTopics = topics.filter(topicMatchesLanguage);
            topicList.innerHTML = "";

            currentUserInfo = await currentUser();

            topics.forEach(topic => {
                const div = document.createElement("div");
                div.className = "topic-card";

                div.addEventListener("click", function() {
                    window.location.href = "/topic.html?id=" + topic.id;
                });

                div.innerHTML =
                    '<div class="topic-title">' + topic.title + '</div>' +
                    '<div class="topic-category">Category: ' + topic.category + '</div>' +
                    '<img src="' + topic.imageUrl + '" alt="' + topic.title + '">' +
                    '<div class="topic-actions">' +
                    '<button class="delete-button">Delete Topic</button>' +
                    '</div>';

                const deleteButton = div.querySelector(".delete-button");

                deleteButton.addEventListener("click", async function(event) {
                    event.stopPropagation();

                    const confirmed = window.confirm('Delete topic "' + topic.title + '"?');
                    if (!confirmed) {
                        return;
                    }

                    try {
                        const deleteResponse = await fetch(API_BASE + "/" + topic.id, {
                            method: "DELETE"
                        });

                        if (!deleteResponse.ok) {
                            throw new Error("HTTP error " + deleteResponse.status);
                        }

                        await loadTopics();
                    } catch (error) {
                        console.error(error);
                        alert("Could not delete topic.");
                    }
                });

                topicList.appendChild(div);
            });
        } catch (error) {
            topicList.innerHTML = "<p>Could not load topics.</p>";
            console.error(error);
        }
    }

    loadTopics();
</script>

<script src="../js/app.js"></script>
<script>
    requireAuth();
    window.addEventListener("DOMContentLoaded", () => {
        attachLogoutButton();
    });
</script>

</body>
</html>
