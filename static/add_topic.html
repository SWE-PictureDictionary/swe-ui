<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Topic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-size: 1.05rem;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            margin-top: 0;
        }

        .form-section {
            max-width: 1100px;
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            max-width: 520px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 8px;
            box-sizing: border-box;
            background: white;
        }

        .helper-text {
            margin-top: 8px;
            color: #444;
        }

        .image-stage {
            position: relative;
            width: min(100%, 1100px);
            margin-top: 24px;
            border-radius: 28px;
            overflow: hidden;
            border: 3px solid #d0d3da;
            background: white;
            min-height: 260px;
        }

        .image-stage.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            padding: 40px;
            box-sizing: border-box;
        }

        .topic-image {
            display: block;
            width: 100%;
            height: auto;
            cursor: crosshair;
        }

        .hotspot-button {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 5px solid white;
            background: #a7afbf;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .hotspot-list {
            margin-top: 20px;
            max-width: 1100px;
            display: grid;
            gap: 10px;
        }

        .hotspot-item {
            background: white;
            border: 1px solid #d0d3da;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .hotspot-item-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hotspot-item-actions {
            display: flex;
            gap: 8px;
        }

        .secondary-button,
        .danger-button,
        .primary-button {
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid black;
        }

        .primary-button {
            background: #b4b4b4;
        }

        .secondary-button {
            background: white;
        }

        .danger-button {
            background: #e7b3b3;
        }

        .save-topic-row {
            margin-top: 24px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card h2 {
            margin-top: 0;
        }

        .modal-actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
<a class="back-link" href="/topic_list.html">← Back to Topics</a>

<h1>Add Topic</h1>
<p id="languageNotice"></p>

<div class="form-section">
    <div class="field-group">
        <label for="topicTitle">Topic Title</label>
        <input id="topicTitle" type="text" placeholder="Example: Classroom Supplies">
    </div>

    <div class="field-group">
        <label for="topicCategory">Category</label>
        <input id="topicCategory" type="text" placeholder="Example: School">
    </div>

    <div class="field-group">
        <label for="topicImageFile">Topic Image</label>
        <input id="topicImageFile" type="file" accept="image/*">
        <div class="helper-text">Choose the main image first. Then click on the image to place hotspots.</div>
    </div>

    <div id="imageStage" class="image-stage empty">
        Upload a topic image to start placing hotspots.
    </div>

    <div class="hotspot-list" id="hotspotList"></div>

    <div class="save-topic-row">
        <button class="primary-button" id="saveTopicButton">Save Topic</button>
    </div>
</div>

<div id="editorOverlay" class="modal-overlay">
    <div class="modal-card">
        <h2 id="editorTitle">New Hotspot</h2>

        <div class="field-group">
            <label for="hotspotLabel">Label</label>
            <input id="hotspotLabel" type="text" placeholder="Example: Paperclip">
        </div>

        <div class="field-group">
            <label for="hotspotTranslation">Word in <span id="languageNameInline"></span></label>
            <input id="hotspotTranslation" type="text" placeholder="Translation">
        </div>

        <div class="field-group">
            <label for="hotspotImageFile">Hotspot Image</label>
            <input id="hotspotImageFile" type="file" accept="image/*">
        </div>

        <div class="field-group">
            <label for="hotspotAudioFile">Hotspot Audio</label>
            <input id="hotspotAudioFile" type="file" accept="audio/*">
        </div>

        <div class="modal-actions">
            <button class="primary-button" id="saveHotspotButton">Save Hotspot</button>
            <button class="secondary-button" id="cancelHotspotButton" type="button">Cancel</button>
            <button class="danger-button" id="deleteHotspotButton" type="button" style="display:none;">Delete Hotspot</button>
        </div>
    </div>
</div>

<script>
    const selectedLanguage = localStorage.getItem("selectedLanguage") || "Spanish";
    const API_BASE = "/topics";

    const topicTitleInput = document.getElementById("topicTitle");
    const topicCategoryInput = document.getElementById("topicCategory");
    const topicImageFileInput = document.getElementById("topicImageFile");
    const imageStage = document.getElementById("imageStage");
    const hotspotList = document.getElementById("hotspotList");
    const saveTopicButton = document.getElementById("saveTopicButton");

    const editorOverlay = document.getElementById("editorOverlay");
    const editorTitle = document.getElementById("editorTitle");
    const hotspotLabelInput = document.getElementById("hotspotLabel");
    const hotspotTranslationInput = document.getElementById("hotspotTranslation");
    const hotspotImageFileInput = document.getElementById("hotspotImageFile");
    const hotspotAudioFileInput = document.getElementById("hotspotAudioFile");
    const saveHotspotButton = document.getElementById("saveHotspotButton");
    const cancelHotspotButton = document.getElementById("cancelHotspotButton");
    const deleteHotspotButton = document.getElementById("deleteHotspotButton");

    document.getElementById("languageNotice").textContent = "New topics created here will be added to " + selectedLanguage + ".";
    document.getElementById("languageNameInline").textContent = selectedLanguage;

    let topicImageDataUrl = "";
    let hotspots = [];
    let editingHotspotIndex = null;
    let pendingXPercent = null;
    let pendingYPercent = null;

    function getTopicLanguageAssignments() {
        try {
            return JSON.parse(localStorage.getItem("topicLanguageAssignments") || "{}");
        } catch (error) {
            return {};
        }
    }

    function saveTopicLanguageAssignments(assignments) {
        localStorage.setItem("topicLanguageAssignments", JSON.stringify(assignments));
    }

    function slugify(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");
    }

    function fileToDataUrl(file) {
        return new Promise(function(resolve, reject) {
            const reader = new FileReader();
            reader.onload = function() {
                resolve(reader.result);
            };
            reader.onerror = function() {
                reject(new Error("Could not read file."));
            };
            reader.readAsDataURL(file);
        });
    }

    function renderImageStage() {
        if (!topicImageDataUrl) {
            imageStage.className = "image-stage empty";
            imageStage.innerHTML = "Upload a topic image to start placing hotspots.";
            return;
        }

        imageStage.className = "image-stage";
        imageStage.innerHTML = "";

        const image = document.createElement("img");
        image.className = "topic-image";
        image.src = topicImageDataUrl;
        image.alt = "Topic image";

        image.addEventListener("click", function(event) {
            const rect = image.getBoundingClientRect();
            const xPercent = ((event.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((event.clientY - rect.top) / rect.height) * 100;

            editingHotspotIndex = null;
            pendingXPercent = Math.max(0, Math.min(100, xPercent));
            pendingYPercent = Math.max(0, Math.min(100, yPercent));
            openHotspotEditor();
        });

        imageStage.appendChild(image);

        hotspots.forEach(function(hotspot, index) {
            const button = document.createElement("button");
            button.className = "hotspot-button";
            button.type = "button";
            button.textContent = String(index + 1);
            button.style.left = hotspot.xPercent + "%";
            button.style.top = hotspot.yPercent + "%";

            button.addEventListener("click", function(event) {
                event.stopPropagation();
                editingHotspotIndex = index;
                openHotspotEditor();
            });

            imageStage.appendChild(button);
        });
    }

    function renderHotspotList() {
        hotspotList.innerHTML = "";

        if (hotspots.length === 0) {
            return;
        }

        hotspots.forEach(function(hotspot, index) {
            const item = document.createElement("div");
            item.className = "hotspot-item";

            const left = document.createElement("div");
            left.className = "hotspot-item-left";

            const title = document.createElement("div");
            title.textContent = (index + 1) + ". " + hotspot.label;

            const subtitle = document.createElement("div");
            subtitle.textContent = selectedLanguage + ": " + ((hotspot.translations && hotspot.translations[selectedLanguage]) || hotspot.label);

            left.appendChild(title);
            left.appendChild(subtitle);

            const actions = document.createElement("div");
            actions.className = "hotspot-item-actions";

            const editButton = document.createElement("button");
            editButton.className = "secondary-button";
            editButton.type = "button";
            editButton.textContent = "Edit";
            editButton.addEventListener("click", function() {
                editingHotspotIndex = index;
                openHotspotEditor();
            });

            const deleteButton = document.createElement("button");
            deleteButton.className = "danger-button";
            deleteButton.type = "button";
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", function() {
                hotspots.splice(index, 1);
                renderImageStage();
                renderHotspotList();
            });

            actions.appendChild(editButton);
            actions.appendChild(deleteButton);

            item.appendChild(left);
            item.appendChild(actions);

            hotspotList.appendChild(item);
        });
    }

    function openHotspotEditor() {
        const hotspot = editingHotspotIndex === null ? null : hotspots[editingHotspotIndex];

        editorTitle.textContent = hotspot ? "Edit Hotspot" : "New Hotspot";
        hotspotLabelInput.value = hotspot ? hotspot.label : "";
        hotspotTranslationInput.value = hotspot && hotspot.translations ? (hotspot.translations[selectedLanguage] || "") : "";
        hotspotImageFileInput.value = "";
        hotspotAudioFileInput.value = "";
        deleteHotspotButton.style.display = hotspot ? "inline-block" : "none";

        editorOverlay.classList.add("show");
    }

    function closeHotspotEditor() {
        editorOverlay.classList.remove("show");
        hotspotLabelInput.value = "";
        hotspotTranslationInput.value = "";
        hotspotImageFileInput.value = "";
        hotspotAudioFileInput.value = "";
        editingHotspotIndex = null;
        pendingXPercent = null;
        pendingYPercent = null;
    }

    topicImageFileInput.addEventListener("change", async function() {
        const file = topicImageFileInput.files[0];
        if (!file) {
            return;
        }

        try {
            topicImageDataUrl = await fileToDataUrl(file);
            renderImageStage();
        } catch (error) {
            console.error(error);
            alert("Could not read the topic image.");
        }
    });

    cancelHotspotButton.addEventListener("click", function() {
        closeHotspotEditor();
    });

    deleteHotspotButton.addEventListener("click", function() {
        if (editingHotspotIndex === null) {
            return;
        }

        hotspots.splice(editingHotspotIndex, 1);
        renderImageStage();
        renderHotspotList();
        closeHotspotEditor();
    });

    saveHotspotButton.addEventListener("click", async function() {
        const label = hotspotLabelInput.value.trim();
        const translation = hotspotTranslationInput.value.trim();

        if (!label) {
            alert("Please enter a hotspot label.");
            return;
        }

        const existingHotspot = editingHotspotIndex === null ? null : hotspots[editingHotspotIndex];

        let imageUrl = existingHotspot ? existingHotspot.imageUrl : "";
        let audioUrls = existingHotspot && existingHotspot.audioUrls ? { ...existingHotspot.audioUrls } : {};
        let translations = existingHotspot && existingHotspot.translations ? { ...existingHotspot.translations } : {};

        try {
            const hotspotImageFile = hotspotImageFileInput.files[0];
            const hotspotAudioFile = hotspotAudioFileInput.files[0];

            if (hotspotImageFile) {
                imageUrl = await fileToDataUrl(hotspotImageFile);
            }

            if (hotspotAudioFile) {
                audioUrls[selectedLanguage] = await fileToDataUrl(hotspotAudioFile);
            }

            translations[selectedLanguage] = translation || label;

            const hotspotPayload = {
                label: label,
                imageUrl: imageUrl,
                xPercent: existingHotspot ? existingHotspot.xPercent : pendingXPercent,
                yPercent: existingHotspot ? existingHotspot.yPercent : pendingYPercent,
                translations: translations,
                audioUrls: audioUrls
            };

            if (editingHotspotIndex === null) {
                hotspots.push(hotspotPayload);
            } else {
                hotspots[editingHotspotIndex] = hotspotPayload;
            }

            renderImageStage();
            renderHotspotList();
            closeHotspotEditor();
        } catch (error) {
            console.error(error);
            alert("Could not save hotspot files.");
        }
    });

    saveTopicButton.addEventListener("click", async function() {
        const title = topicTitleInput.value.trim();
        const category = topicCategoryInput.value.trim() || "Custom";

        if (!title) {
            alert("Please enter a topic title.");
            return;
        }

        if (!topicImageDataUrl) {
            alert("Please upload a topic image.");
            return;
        }

        const topicId = slugify(title) + "-" + Date.now();

        const payload = {
            id: topicId,
            title: title,
            imageUrl: topicImageDataUrl,
            category: category,
            hotspots: hotspots
        };

        try {
            const response = await fetch(API_BASE, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }

            const assignments = getTopicLanguageAssignments();
            assignments[topicId] = [selectedLanguage];
            saveTopicLanguageAssignments(assignments);

            window.location.href = "/topic_list.html";
        } catch (error) {
            console.error(error);
            alert("Could not save topic.");
        }
    });

    renderImageStage();
    renderHotspotList();
</script>
</body>
</html>
