<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Topic</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: white;
            padding: 24px 40px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .back-link {
            text-decoration: none;
            color: #2563eb;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .container {
            max-width: 720px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.10);
        }

        label {
            display: block;
            font-weight: 700;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 16px;
        }

        .preview {
            margin-top: 18px;
            display: none;
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: 18px;
            background: #e2e8f0;
        }

        button {
            width: 100%;
            margin-top: 26px;
            border: none;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            padding: 15px 18px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout-button {
            width: auto;
            margin-top: 0;
            background: #e2e8f0;
            color: #1e293b;
            padding: 11px 16px;
            font-size: 14px;
        }

        .logout-button:hover {
            background: #cbd5e1;
        }

        .message {
            margin-top: 16px;
            color: #dc2626;
            font-weight: 700;
        }
    </style>
</head>
<body>
<header>
    <h1 id="title">Create Topic</h1>
    <div class="header-actions">
        <a id="backLink" class="back-link" href="topic_list.html">Back to Topics</a>
        <button class="logout-button" type="button" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">
    <form id="topicForm">
        <label for="topicName">Topic Name</label>
        <input id="topicName" type="text" placeholder="Example: Clothes" required>

        <label for="topicImage">Topic Image</label>
        <input id="topicImage" type="file" accept="image/*" required>

        <img id="imagePreview" class="preview" alt="Topic preview">

        <button type="submit">Create Topic</button>

        <div id="message" class="message"></div>
    </form>
</main>

<script>
    const TOPIC_UNDO_KEY = "topicUndoAction";

    const params = new URLSearchParams(window.location.search);
    const selectedLanguage = params.get("language") || localStorage.getItem("selectedLanguage") || "Spanish";

    localStorage.setItem("selectedLanguage", selectedLanguage);

    document.getElementById("title").textContent = `Create ${selectedLanguage} Topic`;
    document.getElementById("backLink").href = `topic_list.html?language=${encodeURIComponent(selectedLanguage)}`;

    const form = document.getElementById("topicForm");
    const topicNameInput = document.getElementById("topicName");
    const topicImageInput = document.getElementById("topicImage");
    const imagePreview = document.getElementById("imagePreview");
    const message = document.getElementById("message");

    topicImageInput.addEventListener("change", async () => {
        const file = topicImageInput.files[0];

        if (!file) {
            imagePreview.style.display = "none";
            imagePreview.removeAttribute("src");
            return;
        }

        const dataUrl = await fileToDataUrl(file);
        imagePreview.src = dataUrl;
        imagePreview.style.display = "block";
    });

    form.addEventListener("submit", async event => {
        event.preventDefault();
        message.textContent = "";

        const title = topicNameInput.value.trim();
        const file = topicImageInput.files[0];

        if (!title || !file) {
            message.textContent = "Please enter a topic name and choose an image.";
            return;
        }

        const id = makeId(title);
        const imageUrl = await fileToDataUrl(file);

        const payload = {
            id: id,
            title: title,
            imageUrl: imageUrl,
            category: selectedLanguage,
            hotspots: []
        };

        try {
            const response = await fetch("/topics", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "Could not create topic.");
            }

            assignTopicToLanguage(id, selectedLanguage);

            saveTopicUndoAction({
                type: "create",
                topic: payload,
                language: selectedLanguage,
                assignments: [selectedLanguage]
            });

            window.location.href = `topic_list.html?language=${encodeURIComponent(selectedLanguage)}`;
        } catch (error) {
            message.textContent = error.message;
        }
    });

    function makeId(value) {
        return value
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "") || `topic-${Date.now()}`;
    }

    function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("Could not read image file."));

            reader.readAsDataURL(file);
        });
    }

    function getTopicLanguageAssignments() {
        try {
            return JSON.parse(localStorage.getItem("topicLanguageAssignments")) || {};
        } catch (error) {
            return {};
        }
    }

    function saveTopicLanguageAssignments(assignments) {
        localStorage.setItem("topicLanguageAssignments", JSON.stringify(assignments));
    }

    function assignTopicToLanguage(topicId, language) {
        const assignments = getTopicLanguageAssignments();
        const languages = new Set(assignments[topicId] || []);
        languages.add(language);
        assignments[topicId] = Array.from(languages);
        saveTopicLanguageAssignments(assignments);
    }

    function saveTopicUndoAction(action) {
        localStorage.setItem(TOPIC_UNDO_KEY, JSON.stringify(action));
    }

    function logout() {
        window.location.assign("/logout");
    }
</script>
</body>
</html>
