<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Picture Dictionary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f4f6f8;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: min(100%, 900px);
            padding: 40px 24px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            margin: 0 0 12px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 22px;
            margin-bottom: 36px;
        }

        .language-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            max-width: 760px;
            margin: 0 auto;
        }

        .language-button {
            border: 2px solid black;
            background: #d9d9d9;
            border-radius: 18px;
            padding: 24px 18px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .language-button:hover {
            background: #c9c9c9;
            transform: translateY(-2px);
        }

        .language-button:active {
            transform: translateY(0);
        }

        .logout-button {
            position: fixed;
            top: 22px;
            right: 24px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            color: #222;
            font-size: 15px;
            font-weight: 800;
            padding: 11px 16px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

<button class="logout-button" type="button" onclick="logout()">Logout</button>

<div class="page">
    <h1>Picture Dictionary</h1>
    <p class="subtitle">Choose a language to start studying.</p>

    <div class="language-grid">
        <button class="language-button" type="button" data-language="Spanish">Spanish</button>
        <button class="language-button" type="button" data-language="German">German</button>
        <button class="language-button" type="button" data-language="French">French</button>
        <button class="language-button" type="button" data-language="Italian">Italian</button>
        <button class="language-button" type="button" data-language="Korean">Korean</button>
    </div>
</div>

<script>
    document.querySelectorAll(".language-button").forEach(function(button) {
        button.addEventListener("click", function() {
            const selectedLanguage = button.dataset.language;
            localStorage.setItem("selectedLanguage", selectedLanguage);
            window.location.href = "/topic_list.html?language=" + encodeURIComponent(selectedLanguage);
        });
    });

    function logout() {
        window.location.assign("/logout");
    }
</script>

</body>
</html>
