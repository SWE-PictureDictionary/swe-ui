<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Picture Dictionary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
        }

        .container {
            max-width: 420px;
            margin: 80px auto;
            text-align: center;
            padding: 20px;
        }

        .language-grid {
            display: grid;
            gap: 16px;
        }

        .language-card {
            background: #b4b4b4;
            border: 1px solid black;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .language-card:hover {
            background: #a5a5a5;
            transform: translateY(-1px);
        }

        .language-name {
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>


    <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
        <button id="logoutBtn"
                style="padding:8px 12px; border:1px solid black; border-radius:8px; background:#b4b4b4; cursor:pointer;">
            Logout
        </button>
    </div>

<div class="container">
    <h1>Picture Dictionary</h1>
    <p>Select the language you want to learn.</p>

    <div class="language-grid">
        <div class="language-card" onclick="selectLanguage('Spanish')">
            <div class="language-name">Spanish</div>
        </div>

        <div class="language-card" onclick="selectLanguage('German')">
            <div class="language-name">German</div>
        </div>
    </div>
</div>

<script src="../js/app.js"></script>
<script>
    attachLogoutButton();
    requireAuth().then(user => {
        if (!user) return;

        function selectLanguage(language) {
            localStorage.setItem("selectedLanguage", language);
            window.location.href = "/topic_list.html";
        }

        window.selectLanguage = selectLanguage;
    });
</script>
</body>
</html>
