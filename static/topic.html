<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f4f6f8;
            color: #0f172a;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-size: 18px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 72px;
            font-weight: 700;
            line-height: 1;
            margin: 0 0 12px 0;
        }

        .mode-label {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }

        .mode-button {
            border: 3px solid #111827;
            background: white;
            border-radius: 22px;
            padding: 16px 26px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .image-area {
            display: flex;
            justify-content: center;
            margin-top: 8px;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            width: min(100%, 1120px);
        }

        .topic-image {
            display: block;
            width: 100%;
            height: auto;
            max-height: 72vh;
            object-fit: contain;
            border: 3px solid #d1d5db;
            border-radius: 32px;
            background: white;
        }

        .hotspot {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 5px solid white;
            background: #aeb4bf;
            color: white;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            user-select: none;
        }

        .hotspot.edit-mode {
            background: #9ca3af;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal {
            width: min(100%, 560px);
            background: white;
            border-radius: 24px;
            padding: 28px;
            box-sizing: border-box;
        }

        .modal h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .field-label {
            display: block;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            margin-top: 18px;
        }

        .field-input {
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #6b7280;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 18px;
        }

        .file-input {
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #6b7280;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 18px;
            background: white;
        }

        .modal-actions {
            display: flex;
            gap: 14px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .modal-button {
            border: 2px solid black;
            border-radius: 14px;
            padding: 14px 22px;
            background: #d9d9d9;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-button.cancel {
            background: white;
        }

        .popup-card {
            text-align: center;
        }

        .popup-card img {
            width: min(100%, 260px);
            height: auto;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .popup-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .popup-word {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .hidden-audio {
            display: none;
        }

        @media (max-width: 900px) {
            .header-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-title {
                font-size: 56px;
            }
        }
    </style>
</head>
<body>

<a class="back-link" href="/topic_list.html">← Back to Topics</a>

    <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
            <button id="logoutBtn"
                    style="padding:8px 12px; border:1px solid black; border-radius:8px; background:#b4b4b4; cursor:pointer;">
                Logout
            </button>
    </div>

<div class="page-layout">
    <div class="main-content">
        <h1 id="topicTitle">Topic</h1>
        <p id="language"></p>

        <div class="scene-wrapper" id="sceneWrapper">
            <img id="topicImage" class="topic-image" alt="Topic image">
        </div>
    </div>


<a class="back-link" href="/topic_list.html">← Back to Topics</a>

<div class="header-row">
    <div>
        <h1 id="topicTitle" class="page-title">Topic</h1>
        <p id="modeLabel" class="mode-label" style="display:none;">Mode: Study</p>
    </div>
    <button id="modeButton" class="mode-button" style="display:none;">Enter Edit Mode</button>
</div>

<div class="image-area">
    <div class="image-wrapper" id="imageWrapper">
        <img id="topicImage" class="topic-image" alt="Topic image">
    </div>
</div>

<div id="hotspotModalBackdrop" class="modal-backdrop">
    <div class="modal">
        <h2>New Hotspot</h2>

        <label class="field-label" for="hotspotLabel">Label</label>
        <input id="hotspotLabel" class="field-input" type="text">

        <label class="field-label" for="hotspotWord">Word in Selected Language</label>
        <input id="hotspotWord" class="field-input" type="text">

        <label class="field-label" for="hotspotImageFile">Hotspot Image</label>
        <input id="hotspotImageFile" class="file-input" type="file" accept="image/*">

        <label class="field-label" for="hotspotAudioFile">Hotspot Audio</label>
        <input id="hotspotAudioFile" class="file-input" type="file" accept="audio/*">

        <div class="modal-actions">
            <button id="saveHotspotButton" class="modal-button">Save Hotspot</button>
            <button id="cancelHotspotButton" class="modal-button cancel">Cancel</button>
        </div>
    </div>
</div>

<div id="popupBackdrop" class="modal-backdrop">
    <div class="modal popup-card">
        <img id="popupImage" alt="Hotspot image">
        <div id="popupTitle" class="popup-title"></div>
        <div id="popupWord" class="popup-word"></div>
        <button id="closePopupButton" class="modal-button">Close</button>
        <audio id="popupAudio" class="hidden-audio"></audio>
    </div>
</div>

<script>
    const selectedLanguage = localStorage.getItem("selectedLanguage") || "Spanish";
    const params = new URLSearchParams(window.location.search);
    const topicId = params.get("id");

    const topicTitle = document.getElementById("topicTitle");
    const modeLabel = document.getElementById("modeLabel");
    const modeButton = document.getElementById("modeButton");
    const imageWrapper = document.getElementById("imageWrapper");
    const topicImage = document.getElementById("topicImage");

    const hotspotModalBackdrop = document.getElementById("hotspotModalBackdrop");
    const popupBackdrop = document.getElementById("popupBackdrop");

    let topic = null;
    let editMode = false;
    let pendingXPercent = null;
    let pendingYPercent = null;
    let currentUserInfo = null;
    let userCanEditHotspots = false;

    async function loadTopic() {
        try {
            const response = await fetch("/topics/" + topicId);
            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }

            topic = await response.json();
            topicTitle.innerText = topic.title;
            topicImage.src = topic.imageUrl;
            renderHotspots();
        } catch (error) {
            console.error(error);
            alert("Could not load topic.");
        }
    }

    function setMode(isEditMode) {
        if (isEditMode && !userCanEditHotspots) {
            return;
        }

        editMode = isEditMode;
        modeLabel.innerText = editMode ? "Mode: Edit" : "Mode: Study";
        modeButton.innerText = editMode ? "Leave Edit Mode" : "Enter Edit Mode";
        renderHotspots();
    }

    function applyTopicPermissions() {
        modeLabel.style.display = userCanEditHotspots ? "block" : "none";
        modeButton.style.display = userCanEditHotspots ? "inline-block" : "none";

        if (!userCanEditHotspots) {
            setMode(false);
        }
    }

    function clearHotspotElements() {
        const oldHotspots = imageWrapper.querySelectorAll(".hotspot");
        oldHotspots.forEach(function (element) {
            element.remove();
        });
    }

    function renderHotspots() {
        clearHotspotElements();

        if (!topic || !topic.hotspots) {
            return;
        }

        topic.hotspots.forEach(function (hotspot, index) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "hotspot" + (editMode ? " edit-mode" : "");
            button.style.left = hotspot.xPercent + "%";
            button.style.top = hotspot.yPercent + "%";
            button.innerText = String(index + 1);

            button.addEventListener("click", function (event) {
                event.stopPropagation();

                if (editMode) {
                    deleteHotspot(index);
                    return;
                }

                showPopup(hotspot);
            });

            imageWrapper.appendChild(button);
        });
    }

    function openHotspotModal(xPercent, yPercent) {
        if (!userCanEditHotspots) {
            return;
        }

        pendingXPercent = xPercent;
        pendingYPercent = yPercent;
        document.getElementById("hotspotLabel").value = "";
        document.getElementById("hotspotWord").value = "";
        document.getElementById("hotspotImageFile").value = "";
        document.getElementById("hotspotAudioFile").value = "";
        hotspotModalBackdrop.style.display = "flex";
    }

    function closeHotspotModal() {
        hotspotModalBackdrop.style.display = "none";
        pendingXPercent = null;
        pendingYPercent = null;
    }

    function showPopup(hotspot) {
        const popupImage = document.getElementById("popupImage");
        const popupTitle = document.getElementById("popupTitle");
        const popupWord = document.getElementById("popupWord");

        popupImage.src = hotspot.imageUrl || "";
        popupImage.style.display = hotspot.imageUrl ? "inline-block" : "none";
        popupTitle.innerText = hotspot.label || "";
        popupWord.innerText = hotspot.translations && hotspot.translations[selectedLanguage]
            ? hotspot.translations[selectedLanguage]
            : "";

        popupBackdrop.style.display = "flex";
        playAudioImmediately(hotspot.audioUrls ? hotspot.audioUrls[selectedLanguage] : null);
    }

    function closePopup() {
        popupBackdrop.style.display = "none";
        const popupAudio = document.getElementById("popupAudio");
        popupAudio.pause();
        popupAudio.removeAttribute("src");
        popupAudio.load();
    }

    async function playAudioImmediately(audioUrl) {
        const popupAudio = document.getElementById("popupAudio");
        popupAudio.pause();
        popupAudio.removeAttribute("src");
        popupAudio.load();

        if (!audioUrl) {
            return;
        }

        popupAudio.src = audioUrl;
        popupAudio.load();

        try {
            await popupAudio.play();
        } catch (error) {
            console.warn("Audio autoplay was blocked.", error);
        }
    }

    async function uploadFile(url, file) {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(url, {
            method: "POST",
            headers: csrfHeaders(),
            body: formData
        });

        if (!response.ok) {
            throw new Error("Upload failed with status " + response.status);
        }

        return response.json();
    }

    async function saveHotspot() {
        if (!userCanEditHotspots) {
            return;
        }

        const label = document.getElementById("hotspotLabel").value.trim();
        const translatedWord = document.getElementById("hotspotWord").value.trim();
        const imageFile = document.getElementById("hotspotImageFile").files[0];
        const audioFile = document.getElementById("hotspotAudioFile").files[0];

        if (!label || !translatedWord || !imageFile || !audioFile || pendingXPercent === null || pendingYPercent === null) {
            alert("Please fill in every field before saving the hotspot.");
            return;
        }

        try {
            const imageResponse = await uploadFile("/topics/" + topicId + "/images", imageFile);
            const audioResponse = await uploadFile("/topics/" + topicId + "/audio", audioFile);

            const newHotspot = {
                label: label,
                imageUrl: imageResponse.path,
                xPercent: pendingXPercent,
                yPercent: pendingYPercent,
                translations: {
                    [selectedLanguage]: translatedWord
                },
                audioUrls: {
                    [selectedLanguage]: audioResponse.path
                }
            };

            const response = await fetch("/topics/" + topicId + "/hotspots", {
                method: "POST",
                headers: csrfHeaders({
                    "Content-Type": "application/json"
                }),
                body: JSON.stringify(newHotspot)
            });

            if (!response.ok) {
                throw new Error("Save failed with status " + response.status);
            }

            topic = await response.json();
            closeHotspotModal();
            renderHotspots();
        } catch (error) {
            console.error(error);
            alert("Could not save hotspot.");
        }
    }

    async function deleteHotspot(index) {
        if (!userCanEditHotspots) {
            return;
        }

        const confirmed = window.confirm("Delete this hotspot?");
        if (!confirmed) {
            return;
        }

        try {
            const response = await fetch("/topics/" + topicId + "/hotspots/" + index, {
                method: "DELETE",
                headers: csrfHeaders()
            });

            if (!response.ok) {
                throw new Error("Delete failed with status " + response.status);
            }

            topic = await response.json();
            renderHotspots();
        } catch (error) {
            console.error(error);
            alert("Could not delete hotspot.");
        }
    }

    topicImage.addEventListener("click", function (event) {
        if (!editMode || !userCanEditHotspots) {
            return;
        }

        const rect = topicImage.getBoundingClientRect();
        const xPercent = ((event.clientX - rect.left) / rect.width) * 100;
        const yPercent = ((event.clientY - rect.top) / rect.height) * 100;
        openHotspotModal(Number(xPercent.toFixed(2)), Number(yPercent.toFixed(2)));
    });

    modeButton.addEventListener("click", function () {
        setMode(!editMode);
    });

    document.getElementById("saveHotspotButton").addEventListener("click", saveHotspot);
    document.getElementById("cancelHotspotButton").addEventListener("click", closeHotspotModal);
    document.getElementById("closePopupButton").addEventListener("click", closePopup);

    hotspotModalBackdrop.addEventListener("click", function (event) {
        if (event.target === hotspotModalBackdrop) {
            closeHotspotModal();
        }
    });

    popupBackdrop.addEventListener("click", function (event) {
        if (event.target === popupBackdrop) {
            closePopup();
        }
    });

    loadTopic();
</script>

<script src="../js/app.js"></script>
<script>
    requireAuth().then(user => {
        if (!user) return;

        currentUserInfo = user;
        userCanEditHotspots = canEditHotspots(user);
        applyTopicPermissions();
    });

    window.addEventListener("DOMContentLoaded", () => {
        attachLogoutButton();
    });
</script>

</body>
</html>
