<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Topic</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: white;
            padding: 22px 34px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
        }

        .header-left h1 {
            margin: 0;
            font-size: 30px;
        }

        .header-left p {
            margin: 5px 0 0;
            color: #64748b;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button {
            border: none;
            border-radius: 14px;
            padding: 11px 16px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .logout {
            background: #e2e8f0;
            color: #1e293b;
        }

        .edit-active {
            background: #16a34a;
            color: white;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 24px;
            padding: 28px 34px;
        }

        .study-card {
            background: white;
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.10);
        }

        .image-wrap {
            position: relative;
            width: 100%;
            border-radius: 22px;
            overflow: hidden;
            background: #e2e8f0;
        }

        .topic-image {
            width: 100%;
            display: block;
            max-height: 72vh;
            object-fit: contain;
        }

        .hotspot {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 999px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            border: 3px solid white;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
            cursor: pointer;
            transform: translate(-50%, -50%);
            user-select: none;
        }

        .hotspot:hover {
            background: #1d4ed8;
        }

        .hotspot.editing {
            background: #16a34a;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel-card {
            background: white;
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.10);
        }

        .panel-card h2 {
            margin: 0 0 12px;
            font-size: 21px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stack-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
        }

        .stack-item {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px;
            background: #f8fafc;
        }

        .stack-item strong {
            display: block;
            margin-bottom: 3px;
        }

        .stack-item span {
            color: #64748b;
            font-size: 13px;
        }

        .edit-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .edit-row {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px;
            background: #f8fafc;
        }

        .edit-row-title {
            font-weight: 800;
            margin-bottom: 8px;
        }

        .edit-row-actions {
            display: flex;
            gap: 8px;
        }

        .small-button {
            border: none;
            border-radius: 10px;
            padding: 8px 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 12px;
        }

        .popup-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        .popup {
            width: 95%;
            max-width: 520px;
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
        }

        .popup img {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 18px;
            background: #e2e8f0;
            margin-bottom: 16px;
        }

        .popup h2 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .popup p {
            margin: 0 0 16px;
            color: #64748b;
            font-size: 18px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 20px;
        }

        .modal {
            width: 95%;
            max-width: 560px;
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
        }

        .modal h2 {
            margin: 0 0 14px;
        }

        label {
            display: block;
            font-weight: 800;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 13px;
            padding: 11px 12px;
            font-size: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .message {
            margin-top: 12px;
            color: #dc2626;
            font-weight: 800;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <h1 id="topicTitle">Loading...</h1>
        <p id="topicSubtitle">Study mode</p>
    </div>

    <div class="header-actions">
        <a id="backLink" class="button secondary" href="topic_list.html">Back</a>
        <button id="undoHotspotButton" class="button secondary" type="button">Undo Last Hotspot Change</button>
        <button id="editModeButton" class="button secondary" type="button">Edit Mode</button>
        <button class="button logout" type="button" onclick="logout()">Logout</button>
    </div>
</header>

<main class="layout">
    <section class="study-card">
        <div id="imageWrap" class="image-wrap">
            <img id="topicImage" class="topic-image" alt="Topic image">
        </div>
    </section>

    <aside class="side-panel">
        <section class="panel-card">
            <h2>Progress</h2>
            <div class="stat">
                <span>Total Clicks</span>
                <strong id="totalClicks">0</strong>
            </div>
            <div class="stat">
                <span>Unique Studied</span>
                <strong id="uniqueStudied">0</strong>
            </div>
            <div class="stat">
                <span>Completed Topics</span>
                <strong id="completedTopics">0</strong>
            </div>
            <button id="undoButton" class="button secondary" type="button" style="width:100%; margin-top:14px;">
                Undo Last Click
            </button>
        </section>

        <section class="panel-card">
            <h2>Study Stack</h2>
            <div id="studyStack" class="stack-list"></div>
        </section>

        <section id="editPanel" class="panel-card" style="display:none;">
            <h2>Edit Hotspots</h2>
            <p style="color:#64748b; margin-top:0;">Click the topic image to add a hotspot.</p>
            <div id="editList" class="edit-list"></div>
        </section>
    </aside>
</main>

<div id="popupBackdrop" class="popup-backdrop">
    <div class="popup">
        <img id="popupImage" alt="Hotspot image" style="display:none;">
        <h2 id="popupLabel"></h2>
        <p id="popupTranslation"></p>
        <div class="modal-actions">
            <button id="popupAudioButton" class="button primary" type="button">Play Audio</button>
            <button id="popupCloseButton" class="button secondary" type="button">Close</button>
        </div>
    </div>
</div>

<div id="hotspotModalBackdrop" class="modal-backdrop">
    <div class="modal">
        <h2 id="hotspotModalTitle">Add Hotspot</h2>

        <label for="hotspotLabel">Label</label>
        <input id="hotspotLabel" type="text" placeholder="Example: Chair">

        <label id="translationLabel" for="hotspotTranslation">Translation</label>
        <input id="hotspotTranslation" type="text" placeholder="Translation">

        <label for="hotspotImageFile">Hotspot Popup Image</label>
        <input id="hotspotImageFile" type="file" accept="image/*">

        <label for="hotspotAudioFile">Hotspot Audio</label>
        <input id="hotspotAudioFile" type="file" accept="audio/*">

        <div id="modalMessage" class="message"></div>

        <div class="modal-actions">
            <button id="cancelHotspotButton" class="button secondary" type="button">Cancel</button>
            <button id="saveHotspotButton" class="button primary" type="button">Save</button>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const topicId = params.get("id") || params.get("topicId");
    const learnerId = 1;
    const selectedLanguage = params.get("language") || localStorage.getItem("selectedLanguage") || "Spanish";

    localStorage.setItem("selectedLanguage", selectedLanguage);

    const topicTitle = document.getElementById("topicTitle");
    const topicSubtitle = document.getElementById("topicSubtitle");
    const backLink = document.getElementById("backLink");
    const editModeButton = document.getElementById("editModeButton");
    const undoHotspotButton = document.getElementById("undoHotspotButton");
    const topicImage = document.getElementById("topicImage");
    const imageWrap = document.getElementById("imageWrap");
    const editPanel = document.getElementById("editPanel");
    const editList = document.getElementById("editList");
    const totalClicks = document.getElementById("totalClicks");
    const uniqueStudied = document.getElementById("uniqueStudied");
    const completedTopics = document.getElementById("completedTopics");
    const studyStack = document.getElementById("studyStack");
    const undoButton = document.getElementById("undoButton");

    const popupBackdrop = document.getElementById("popupBackdrop");
    const popupImage = document.getElementById("popupImage");
    const popupLabel = document.getElementById("popupLabel");
    const popupTranslation = document.getElementById("popupTranslation");
    const popupAudioButton = document.getElementById("popupAudioButton");
    const popupCloseButton = document.getElementById("popupCloseButton");

    const hotspotModalBackdrop = document.getElementById("hotspotModalBackdrop");
    const hotspotModalTitle = document.getElementById("hotspotModalTitle");
    const hotspotLabel = document.getElementById("hotspotLabel");
    const hotspotTranslation = document.getElementById("hotspotTranslation");
    const hotspotImageFile = document.getElementById("hotspotImageFile");
    const hotspotAudioFile = document.getElementById("hotspotAudioFile");
    const translationLabel = document.getElementById("translationLabel");
    const modalMessage = document.getElementById("modalMessage");
    const cancelHotspotButton = document.getElementById("cancelHotspotButton");
    const saveHotspotButton = document.getElementById("saveHotspotButton");

    let topic = null;
    let editMode = false;
    let modalMode = "add";
    let modalX = 50;
    let modalY = 50;
    let editingIndex = -1;
    let activeAudio = null;
    let currentPopupAudioUrl = "";
    let progressEvent = null;

    const stackStorageKey = `studyStack:${topicId}:${selectedLanguage}`;
    const hotspotUndoStorageKey = `hotspotUndoAction:${topicId}:${selectedLanguage}`;

    localStorage.setItem("learnerId", learnerId);

    backLink.href = `topic_list.html?language=${encodeURIComponent(selectedLanguage)}`;
    translationLabel.textContent = `${selectedLanguage} Translation`;

    let clickedStack = loadStack();

    if (!topicId) {
        topicTitle.textContent = "Missing topic id";
        topicSubtitle.textContent = "Go back and choose a topic.";
    } else {
        loadTopic();
    }

    editModeButton.addEventListener("click", () => {
        editMode = !editMode;
        render();
    });

    undoHotspotButton.addEventListener("click", undoLastHotspotChange);
    undoButton.addEventListener("click", undoLastStudyClick);

    imageWrap.addEventListener("click", event => {
        if (!editMode || event.target.classList.contains("hotspot")) {
            return;
        }

        const rect = imageWrap.getBoundingClientRect();
        modalX = ((event.clientX - rect.left) / rect.width) * 100;
        modalY = ((event.clientY - rect.top) / rect.height) * 100;

        openAddHotspotModal(modalX, modalY);
    });

    popupCloseButton.addEventListener("click", closePopup);

    popupBackdrop.addEventListener("click", event => {
        if (event.target === popupBackdrop) {
            closePopup();
        }
    });

    popupAudioButton.addEventListener("click", () => {
        playAudio(currentPopupAudioUrl);
    });

    cancelHotspotButton.addEventListener("click", closeHotspotModal);
    saveHotspotButton.addEventListener("click", saveHotspot);

    async function loadTopic() {
        try {
            const response = await fetch(`/topics/${encodeURIComponent(topicId)}`);

            if (!response.ok) {
                throw new Error("Could not load topic.");
            }

            topic = await response.json();
            render();
            await fetchProgressEvent();
        } catch (error) {
            topicTitle.textContent = "Error";
            topicSubtitle.textContent = error.message;
        }
    }

    function render() {
        if (!topic) {
            return;
        }

        topicTitle.textContent = topic.title || "Untitled Topic";
        topicSubtitle.textContent = `${selectedLanguage} study mode`;
        topicImage.src = topic.imageUrl || "";
        topicImage.alt = topic.title || "Topic image";

        editModeButton.textContent = editMode ? "Done Editing" : "Edit Mode";
        editModeButton.className = editMode ? "button edit-active" : "button secondary";
        editPanel.style.display = editMode ? "block" : "none";

        renderHotspots();
        renderProgress();
        renderEditList();
    }

    function renderHotspots() {
        imageWrap.querySelectorAll(".hotspot").forEach(marker => marker.remove());

        const hotspots = topic.hotspots || [];

        hotspots.forEach((hotspot, index) => {
            const marker = document.createElement("div");
            marker.className = editMode ? "hotspot editing" : "hotspot";
            marker.textContent = String(index + 1);

            const x = Number(hotspot.xPercent ?? hotspot.xpercent ?? 50);
            const y = Number(hotspot.yPercent ?? hotspot.ypercent ?? 50);

            marker.style.left = `${x}%`;
            marker.style.top = `${y}%`;

            marker.addEventListener("click", event => {
                event.stopPropagation();

                if (editMode) {
                    openEditHotspotModal(index);
                } else {
                    handleStudyClick(hotspot);
                }
            });

            imageWrap.appendChild(marker);
        });
    }

    function handleStudyClick(hotspot) {
        const label = hotspot.label || "Hotspot";
        const translation = getLanguageValue(hotspot.translations) || "";
        const audioUrl = getLanguageValue(hotspot.audioUrls) || "";

        clickedStack.push({
            label: label,
            translation: translation,
            time: new Date().toLocaleTimeString()
        });

        saveStack();
        renderProgress();

        openPopup(hotspot);
        playAudio(audioUrl);
        recordProgressClick(label);
    }

    function renderProgress() {
        totalClicks.textContent = String(clickedStack.length);

        const uniqueLabels = new Set(clickedStack.map(item => item.label));
        uniqueStudied.textContent = String(uniqueLabels.size);

        completedTopics.textContent = String(progressEvent?.completedTopicCount ?? 0);

        if (!clickedStack.length) {
            studyStack.innerHTML = `<p style="color:#64748b;">No hotspots clicked yet.</p>`;
            return;
        }

        studyStack.innerHTML = "";

        [...clickedStack].reverse().forEach(item => {
            const div = document.createElement("div");
            div.className = "stack-item";
            div.innerHTML = `
                <strong>${escapeHtml(item.label)}</strong>
                <span>${escapeHtml(item.translation || selectedLanguage)} • ${escapeHtml(item.time)}</span>
            `;
            studyStack.appendChild(div);
        });
    }

    function renderEditList() {
        const hotspots = topic.hotspots || [];

        if (!hotspots.length) {
            editList.innerHTML = `<p style="color:#64748b;">No hotspots yet. Click the image to add one.</p>`;
            return;
        }

        editList.innerHTML = "";

        hotspots.forEach((hotspot, index) => {
            const row = document.createElement("div");
            row.className = "edit-row";

            row.innerHTML = `
                <div class="edit-row-title">${index + 1}. ${escapeHtml(hotspot.label)}</div>
                <div class="edit-row-actions">
                    <button class="small-button primary" type="button">Edit</button>
                    <button class="small-button danger" type="button">Delete</button>
                </div>
            `;

            const buttons = row.querySelectorAll("button");

            buttons[0].addEventListener("click", () => openEditHotspotModal(index));
            buttons[1].addEventListener("click", () => deleteHotspot(index));

            editList.appendChild(row);
        });
    }

    function openPopup(hotspot) {
        const label = hotspot.label || "Hotspot";
        const translation = getLanguageValue(hotspot.translations) || "";
        const imageUrl = hotspot.imageUrl || "";
        const audioUrl = getLanguageValue(hotspot.audioUrls) || "";

        popupLabel.textContent = label;
        popupTranslation.textContent = translation ? `${selectedLanguage}: ${translation}` : selectedLanguage;

        if (imageUrl) {
            popupImage.src = imageUrl;
            popupImage.style.display = "block";
        } else {
            popupImage.removeAttribute("src");
            popupImage.style.display = "none";
        }

        currentPopupAudioUrl = audioUrl;
        popupAudioButton.style.display = audioUrl ? "inline-block" : "none";

        popupBackdrop.style.display = "flex";
    }

    function closePopup() {
        popupBackdrop.style.display = "none";
    }

    function openAddHotspotModal(x, y) {
        modalMode = "add";
        modalX = x;
        modalY = y;
        editingIndex = -1;

        hotspotModalTitle.textContent = "Add Hotspot";
        hotspotLabel.value = "";
        hotspotTranslation.value = "";
        hotspotImageFile.value = "";
        hotspotAudioFile.value = "";
        modalMessage.textContent = "";

        hotspotModalBackdrop.style.display = "flex";
    }

    function openEditHotspotModal(index) {
        const hotspot = topic.hotspots[index];

        modalMode = "edit";
        editingIndex = index;
        modalX = Number(hotspot.xPercent ?? hotspot.xpercent ?? 50);
        modalY = Number(hotspot.yPercent ?? hotspot.ypercent ?? 50);

        hotspotModalTitle.textContent = "Edit Hotspot";
        hotspotLabel.value = hotspot.label || "";
        hotspotTranslation.value = getLanguageValue(hotspot.translations) || "";
        hotspotImageFile.value = "";
        hotspotAudioFile.value = "";
        modalMessage.textContent = "";

        hotspotModalBackdrop.style.display = "flex";
    }

    function closeHotspotModal() {
        hotspotModalBackdrop.style.display = "none";
    }

    async function saveHotspot() {
        modalMessage.textContent = "";

        const label = hotspotLabel.value.trim();
        const translation = hotspotTranslation.value.trim();

        if (!label) {
            modalMessage.textContent = "Label is required.";
            return;
        }

        try {
            let existingHotspot = null;

            if (modalMode === "edit") {
                existingHotspot = topic.hotspots[editingIndex];
            }

            let imageUrl = existingHotspot?.imageUrl || "";
            let audioUrl = getLanguageValue(existingHotspot?.audioUrls) || "";

            if (hotspotImageFile.files[0]) {
                imageUrl = await uploadFile("images", hotspotImageFile.files[0]);
            }

            if (hotspotAudioFile.files[0]) {
                audioUrl = await uploadFile("audio", hotspotAudioFile.files[0]);
            }

            const translations = {
                ...(existingHotspot?.translations || {}),
                [selectedLanguage]: translation || label
            };

            const audioUrls = {
                ...(existingHotspot?.audioUrls || {})
            };

            if (audioUrl) {
                audioUrls[selectedLanguage] = audioUrl;
            }

            const payload = {
                label: label,
                imageUrl: imageUrl,
                xPercent: modalX,
                yPercent: modalY,
                translations: translations,
                audioUrls: audioUrls
            };

            let response;

            if (modalMode === "add") {
                response = await fetch(`/topics/${encodeURIComponent(topicId)}/hotspots`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
            } else {
                const oldLabel = topic.hotspots[editingIndex].label;

                response = await fetch(`/topics/${encodeURIComponent(topicId)}/hotspots/${encodeURIComponent(oldLabel)}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
            }

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "Could not save hotspot.");
            }

            if (modalMode === "add") {
                saveHotspotUndoAction({
                    type: "create",
                    hotspot: payload
                });
            }

            closeHotspotModal();
            await loadTopic();
        } catch (error) {
            modalMessage.textContent = error.message;
        }
    }

    async function deleteHotspot(index) {
        const confirmed = confirm("Delete this hotspot?");

        if (!confirmed) {
            return;
        }

        try {
            const deletedHotspot = JSON.parse(JSON.stringify(topic.hotspots[index]));

            const response = await fetch(`/topics/${encodeURIComponent(topicId)}/hotspots/${index}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "Could not delete hotspot.");
            }

            saveHotspotUndoAction({
                type: "delete",
                hotspot: deletedHotspot,
                index: index
            });

            await loadTopic();
        } catch (error) {
            alert(error.message);
        }
    }

    async function undoLastHotspotChange() {
        const action = getHotspotUndoAction();

        if (!action) {
            alert("No hotspot change to undo.");
            return;
        }

        try {
            if (action.type === "create") {
                await loadTopic();

                const index = findHotspotIndex(action.hotspot);

                if (index < 0) {
                    clearHotspotUndoAction();
                    alert("That created hotspot is no longer on this topic.");
                    return;
                }

                const response = await fetch(`/topics/${encodeURIComponent(topicId)}/hotspots/${index}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Could not undo hotspot creation.");
                }
            } else if (action.type === "delete") {
                const response = await fetch(`/topics/${encodeURIComponent(topicId)}/hotspots`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(action.hotspot)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Could not undo hotspot deletion.");
                }
            }

            clearHotspotUndoAction();
            await loadTopic();
        } catch (error) {
            alert(error.message);
        }
    }

    function findHotspotIndex(targetHotspot) {
        const hotspots = topic?.hotspots || [];
        const targetLabel = (targetHotspot?.label || "").toLowerCase();

        return hotspots.findIndex(hotspot => {
            const sameLabel = (hotspot.label || "").toLowerCase() === targetLabel;
            const sameX = Number(hotspot.xPercent ?? hotspot.xpercent ?? 50) === Number(targetHotspot.xPercent ?? targetHotspot.xpercent ?? 50);
            const sameY = Number(hotspot.yPercent ?? hotspot.ypercent ?? 50) === Number(targetHotspot.yPercent ?? targetHotspot.ypercent ?? 50);

            return sameLabel && sameX && sameY;
        });
    }

    function getHotspotUndoAction() {
        try {
            return JSON.parse(localStorage.getItem(hotspotUndoStorageKey));
        } catch {
            return null;
        }
    }

    function saveHotspotUndoAction(action) {
        localStorage.setItem(hotspotUndoStorageKey, JSON.stringify(action));
    }

    function clearHotspotUndoAction() {
        localStorage.removeItem(hotspotUndoStorageKey);
    }

    async function uploadFile(type, file) {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(`/topics/${encodeURIComponent(topicId)}/${type}`, {
            method: "POST",
            body: formData
        });

        const text = await response.text();

        if (!response.ok) {
            throw new Error(text || `Could not upload ${type}.`);
        }

        return cleanReturnedPath(text);
    }

    function cleanReturnedPath(value) {
        let cleaned = String(value || "").trim();

        if (cleaned.startsWith("{")) {
            try {
                const json = JSON.parse(cleaned);
                return json.url || json.path || json.imageUrl || json.audioUrl || cleaned;
            } catch {
                return cleaned;
            }
        }

        if (
            (cleaned.startsWith('"') && cleaned.endsWith('"')) ||
            (cleaned.startsWith("'") && cleaned.endsWith("'"))
        ) {
            cleaned = cleaned.slice(1, -1);
        }

        return cleaned;
    }

    function playAudio(audioUrl) {
        if (!audioUrl) {
            return;
        }

        try {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.currentTime = 0;
            }

            activeAudio = new Audio(audioUrl);
            activeAudio.play().catch(error => {
                console.warn("Audio could not autoplay:", error);
            });
        } catch (error) {
            console.warn("Audio error:", error);
        }
    }

    function getLanguageValue(object) {
        if (!object) {
            return "";
        }

        if (object[selectedLanguage]) {
            return object[selectedLanguage];
        }

        const key = Object.keys(object).find(item => item.toLowerCase() === selectedLanguage.toLowerCase());

        return key ? object[key] : "";
    }

    async function recordProgressClick(label) {
        try {
            await fetch("/progress/click", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    learnerId: learnerId,
                    topicId: topicId,
                    label: label
                })
            });

            await fetchProgressEvent();
        } catch (error) {
            console.warn("Could not record progress click:", error);
        }
    }

    async function undoLastStudyClick() {
        if (!clickedStack.length) {
            alert("No study click to undo.");
            return;
        }

        clickedStack.pop();
        saveStack();
        renderProgress();

        try {
            const response = await fetch(`/progress/${encodeURIComponent(learnerId)}/topic/${encodeURIComponent(topicId)}/latest`, {
                method: "DELETE"
            });

            if (!response.ok) {
                console.warn("Backend undo click failed with status:", response.status);
            }

            await fetchProgressEvent();
        } catch (error) {
            console.warn("Could not undo backend progress click:", error);
        }

        renderProgress();
    }

    async function fetchProgressEvent() {
        try {
            const response = await fetch(`/progress/${encodeURIComponent(learnerId)}/event`);

            if (!response.ok) {
                throw new Error("Progress event request failed.");
            }

            progressEvent = await response.json();
            renderProgress();
        } catch (error) {
            console.warn("Could not load progress event:", error);
            progressEvent = null;
            renderProgress();
        }
    }

    function loadStack() {
        try {
            return JSON.parse(localStorage.getItem(stackStorageKey)) || [];
        } catch {
            return [];
        }
    }

    function saveStack() {
        localStorage.setItem(stackStorageKey, JSON.stringify(clickedStack));
    }

    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function logout() {
        window.location.assign("/logout");
    }
</script>
