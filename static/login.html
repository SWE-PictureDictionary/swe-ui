<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Picture Dictionary Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 460px;
            margin: 80px auto;
            text-align: center;
            background: white;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .login-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border: 1px solid black;
            border-radius: 8px;
            background: #b4b4b4;
            color: black;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .demo-box {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #ddd;
            background: #fafafa;
            border-radius: 8px;
            font-size: 14px;
            text-align: left;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Picture Dictionary</h1>
    <p>Please sign in to continue.</p>

    <button class="login-button" id="loginBtn">Log in with Keycloak</button>

    <div class="demo-box">
        <strong>Demo accounts in Keycloak</strong><br>
        Learner: <code>learner1</code> / <code>password</code><br>
        Content Manager: <code>manager1</code> / <code>password</code>
    </div>
</div>

<script>
    document.getElementById("loginBtn").addEventListener("click", () => {
        window.location.assign("/oauth2/authorization/keycloak");
    });

    fetch("/api/me")
        .then(response => {
            if (response.status === 401) return null;
            if (!response.ok) throw new Error("Could not fetch current user");
            return response.json();
        })
        .then(user => {
            if (user) {
                window.location.href = "/index.html";
            }
        })
        .catch(() => {});
</script>
</body>
</html>
